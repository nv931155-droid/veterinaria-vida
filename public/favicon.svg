:root {
  --primary: #164e48;
  --primary-dark: #0f3835;
  --secondary: #75b89a;
  --cream: #f5f3e9;
  --orange: #f4a261;
  --white: #ffffff;
  --text: #1a1d1f;
  --muted: #5f6c68;
  --line: rgba(22, 78, 72, 0.12);
  --shadow: 0 20px 45px rgba(18, 42, 35, 0.12);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: var(--cream);
  color: var(--text);
}

img {
  display: block;
  max-width: 100%;
}

a {
  text-decoration: none;
  color: inherit;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.container {
  width: min(1180px, calc(100% - 2rem));
  margin: 0 auto;
}

.section {
  padding: 5.5rem 0;
}

.section-alt {
  background: rgba(117, 184, 154, 0.08);
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--secondary);
  background: rgba(117, 184, 154, 0.14);
  border-radius: 999px;
  padding: 0.65rem 1rem;
  margin-bottom: 1.25rem;
}

.eyebrow-dark {
  color: var(--primary);
  background: rgba(22, 78, 72, 0.08);
}

h1,
h2,
h3,
.brand strong {
  font-family: 'Poppins', sans-serif;
}

.site-header {
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(14px);
  background: rgba(245, 243, 233, 0.8);
  border-bottom: 1px solid rgba(22, 78, 72, 0.06);
}

.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 82px;
  gap: 1rem;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 0.8rem;
  font-weight: 700;
  color: var(--primary);
}

.brand span {
  display: block;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.brand strong {
  display: block;
  font-size: 1.45rem;
  line-height: 1;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 2.5rem;
  height: 2.5rem;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: var(--white);
  font-weight: 800;
  box-shadow: 0 14px 24px rgba(22, 78, 72, 0.22);
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  color: var(--primary);
  font-weight: 600;
}

.nav-links a {
  position: relative;
  transition: color 0.2s ease;
}

.nav-links a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -0.45rem;
  width: 100%;
  height: 2px;
  background: var(--orange);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.2s ease;
}

.nav-links a:hover::after,
.nav-links a:focus-visible::after {
  transform: scaleX(1);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 46px;
  padding: 0.8rem 1.2rem;
  border-radius: 999px;
  border: 1px solid transparent;
  font-weight: 700;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}

.btn:hover {
  transform: translateY(-1px);
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: var(--white);
  box-shadow: 0 18px 30px rgba(22, 78, 72, 0.2);
}

.btn-secondary {
  border-color: rgba(22, 78, 72, 0.18);
  background: rgba(255, 255, 255, 0.8);
  color: var(--primary);
}

.menu-toggle {
  display: none;
  border: 0;
  background: transparent;
  font-size: 1.7rem;
  color: var(--primary);
}

.hero {
  position: relative;
  padding: 5rem 0 3rem;
  overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute;
  inset: 2rem auto auto -7rem;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: rgba(117, 184, 154, 0.18);
  filter: blur(20px);
}

.hero-grid {
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  align-items: center;
  gap: 2rem;
}

.hero-copy h1 {
  max-width: 620px;
  font-size: clamp(2.7rem, 4vw, 4.4rem);
  line-height: 1.08;
  color: var(--primary);
  margin-bottom: 1rem;
}

.hero-copy p {
  max-width: 560px;
  color: var(--muted);
  font-size: 1.08rem;
  line-height: 1.75;
  margin-bottom: 1.8rem;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
}

.hero-highlights {
  display: flex;
  flex-wrap: wrap;
  gap: 2rem;
  margin-top: 2.2rem;
}

.hero-highlights div {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.hero-highlights strong {
  color: var(--primary);
  font-size: 1.5rem;
}

.hero-highlights span {
  color: var(--muted);
}

.hero-visual {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 520px;
}

.visual-main {
  width: min(100%, 530px);
  border-radius: 32px;
  overflow: hidden;
  box-shadow: var(--shadow);
  transform: rotate(-3deg);
}

.visual-main img {
  width: 100%;
  height: 650px;
  object-fit: cover;
}

.floating-card {
  position: absolute;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  padding: 1rem 1.2rem;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(12px);
  box-shadow: var(--shadow);
  color: var(--primary);
  animation: float 4s ease-in-out infinite;
}

.card-one {
  left: 0;
  bottom: 2rem;
}

.card-two {
  right: 0.5rem;
  top: 2rem;
  animation-delay: 1.5s;
}

.floating-card span {
  font-size: 0.8rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}

.stats-wrap {
  padding-bottom: 1rem;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1rem;
}

.stat-item {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 1.6rem 1rem;
  text-align: center;
  box-shadow: 0 18px 30px rgba(18, 42, 35, 0.04);
}

.stat-item strong {
  display: block;
  font-size: clamp(1.7rem, 2vw, 2.3rem);
  color: var(--primary);
  font-family: 'Poppins', sans-serif;
}

.stat-item span {
  color: var(--muted);
  font-weight: 500;
}

.section-heading {
  margin-bottom: 2.2rem;
}

.section-heading h2 {
  max-width: 720px;
  font-size: clamp(2rem, 3vw, 3rem);
  line-height: 1.2;
  color: var(--primary);
}

.section-heading.center {
  text-align: center;
}

.section-heading.center h2 {
  margin: 0 auto;
}

.service-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1.5rem;
}

.service-card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 28px;
  padding: 1.8rem 1.4rem;
  box-shadow: 0 18px 32px rgba(22, 78, 72, 0.05);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.service-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 25px 42px rgba(22, 78, 72, 0.08);
}

.service-icon {
  display: grid;
  place-items: center;
  width: 3.5rem;
  height: 3.5rem;
  border-radius: 16px;
  margin-bottom: 1rem;
  background: rgba(117, 184, 154, 0.14);
  font-size: 1.5rem;
}

.service-card h3 {
  color: var(--primary);
  font-size: 1.4rem;
  margin-bottom: 0.95rem;
}

.service-card p {
  color: var(--muted);
  line-height: 1.7;
}

.service-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-top: 1.3rem;
}

.service-meta span {
  font-weight: 700;
  color: var(--primary);
}

.service-meta button {
  border: 0;
  background: rgba(244, 162, 97, 0.14);
  color: var(--primary);
  font-weight: 700;
  border-radius: 999px;
  padding: 0.7rem 1rem;
}

.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
  align-items: center;
}

.about-visual img {
  width: 100%;
  min-height: 520px;
  object-fit: cover;
  border-radius: 30px;
  box-shadow: var(--shadow);
}

.about-copy h2 {
  font-size: clamp(2rem, 3vw, 3rem);
  line-height: 1.2;
  color: var(--primary);
  margin-bottom: 1rem;
}

.about-copy p {
  color: var(--muted);
  line-height: 1.8;
  margin-bottom: 1.5rem;
}

.feature-list {
  list-style: none;
  display: grid;
  gap: 0.9rem;
  margin-bottom: 1.5rem;
}

.feature-list li {
  position: relative;
  padding-left: 1.8rem;
  color: var(--text);
  font-weight: 500;
}

.feature-list li::before {
  content: '✓';
  position: absolute;
  left: 0;
  top: 0;
  color: var(--secondary);
  font-weight: 800;
}

.about-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 0.7rem;
}

.about-badges span {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.65rem 1rem;
  border-radius: 999px;
  background: rgba(117, 184, 154, 0.12);
  color: var(--primary);
  font-weight: 600;
}

.care-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1.5rem;
}

.care-card {
  background: var(--white);
  border-radius: 26px;
  border: 1px solid var(--line);
  padding: 2rem 1.5rem;
  box-shadow: 0 16px 28px rgba(22, 78, 72, 0.04);
}

.care-icon {
  display: grid;
  place-items: center;
  width: 3.6rem;
  height: 3.6rem;
  border-radius: 18px;
  font-size: 1.6rem;
  background: rgba(117, 184, 154, 0.12);
  margin-bottom: 1rem;
}

.care-card h3 {
  color: var(--primary);
  margin-bottom: 0.7rem;
}

.care-card p {
  color: var(--muted);
  line-height: 1.7;
}

.team-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1.5rem;
}

.team-card {
  background: var(--white);
  border-radius: 30px;
  overflow: hidden;
  border: 1px solid var(--line);
  transform: translateY(0);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.team-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 22px 40px rgba(22, 78, 72, 0.08);
}

.team-card img {
  height: 320px;
  width: 100%;
  object-fit: cover;
}

.team-content {
  padding: 1.5rem 1.2rem 1.7rem;
}

.team-content h3 {
  color: var(--primary);
  font-size: 1.4rem;
  margin-bottom: 0.4rem;
}

.team-content span {
  display: inline-block;
  color: var(--orange);
  font-weight: 700;
  margin-bottom: 0.7rem;
}

.team-content p {
  color: var(--muted);
  line-height: 1.6;
}

.testimonial-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1.5rem;
}

.testimonial-card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 26px;
  padding: 1.8rem 1.5rem;
  box-shadow: 0 18px 30px rgba(22, 78, 72, 0.05);
}

.stars {
  color: var(--orange);
  letter-spacing: 0.18em;
  margin-bottom: 0.8rem;
}

.testimonial-card p {
  color: var(--text);
  line-height: 1.8;
  margin-bottom: 1rem;
}

.testimonial-card footer {
  font-weight: 700;
  color: var(--primary);
}

.faq-grid {
  display: grid;
  grid-template-columns: 0.9fr 1.1fr;
  gap: 2rem;
  align-items: start;
}

.faq-copy h2 {
  color: var(--primary);
  font-size: clamp(2rem, 3vw, 3rem);
  line-height: 1.2;
  margin-bottom: 1rem;
}

.faq-copy p {
  color: var(--muted);
  line-height: 1.8;
  max-width: 540px;
}

.faq-list {
  display: grid;
  gap: 0.9rem;
}

.faq-item {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 20px;
  overflow: hidden;
}

.faq-item button {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  border: 0;
  background: transparent;
  text-align: left;
  padding: 1.1rem 1.2rem;
  color: var(--primary);
  font-weight: 700;
}

.faq-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 2rem;
  height: 2rem;
  border-radius: 50%;
  background: rgba(117, 184, 154, 0.12);
  color: var(--primary);
  font-size: 1.4rem;
}

.faq-answer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.25s ease;
}

.faq-item.open .faq-answer {
  max-height: 180px;
}

.faq-answer p {
  padding: 0 1.2rem 1.2rem;
  color: var(--muted);
  line-height: 1.7;
}

.appointment-section {
  padding-top: 1rem;
}

.appointment-grid {
  display: grid;
  grid-template-columns: 0.9fr 1.1fr;
  gap: 2rem;
  align-items: start;
}

.contact-panel {
  background: linear-gradient(180deg, rgba(117, 184, 154, 0.13), rgba(255, 255, 255, 0.64));
  border: 1px solid var(--line);
  border-radius: 30px;
  padding: 2rem;
}

.contact-panel h2 {
  color: var(--primary);
  font-size: clamp(2rem, 3vw, 3rem);
  line-height: 1.2;
  margin-bottom: 1.5rem;
}

.contact-list {
  display: grid;
  gap: 1.1rem;
}

.contact-list strong {
  color: var(--primary);
}

.contact-list p {
  margin-top: 0.3rem;
  color: var(--muted);
}

.appointment-form {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 30px;
  padding: 2rem 1.6rem;
  box-shadow: 0 18px 34px rgba(22, 78, 72, 0.05);
}

.input-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-bottom: 1rem;
}

.input-row.single {
  grid-template-columns: 1fr;
}

.appointment-form label {
  display: grid;
  gap: 0.45rem;
  font-weight: 600;
  color: var(--primary);
}

.appointment-form input,
.appointment-form select,
.appointment-form textarea {
  width: 100%;
  border: 1px solid rgba(22, 78, 72, 0.15);
  background: rgba(245, 243, 233, 0.85);
  border-radius: 14px;
  min-height: 52px;
  padding: 0.85rem 1rem;
  color: var(--text);
}

.appointment-form textarea {
  min-height: 120px;
  resize: vertical;
}

.submit-btn {
  width: 100%;
  margin-top: 0.8rem;
}

.success-message {
  margin-top: 1rem;
  padding: 1rem 1.1rem;
  border-radius: 14px;
  background: rgba(117, 184, 154, 0.14);
  color: var(--primary);
  font-weight: 600;
  line-height: 1.6;
}

.site-footer {
  background: var(--primary);
  color: rgba(255, 255, 255, 0.82);
  padding: 1.5rem 0;
}

.footer-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.footer-brand {
  color: var(--white);
}

.footer-links {
  display: flex;
  align-items: center;
  gap: 1rem;
}

@keyframes float {
  0%,
  100% {
    transform: translateY(0px);
  }
  50% {
    transform: translateY(-10px);
  }
}

@media (max-width: 980px) {
  .hero-grid,
  .about-grid,
  .faq-grid,
  .appointment-grid {
    grid-template-columns: 1fr;
  }

  .service-grid,
  .team-grid,
  .testimonial-grid,
  .care-grid,
  .stats-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .nav-cta {
    display: none;
  }
}

@media (max-width: 760px) {
  .menu-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .nav-links {
    position: absolute;
    left: 1rem;
    right: 1rem;
    top: calc(100% + 0.5rem);
    display: none;
    flex-direction: column;
    align-items: flex-start;
    padding: 1rem;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
  }

  .nav-links.open {
    display: flex;
  }

  .service-grid,
  .team-grid,
  .testimonial-grid,
  .care-grid,
  .stats-grid,
  .input-row {
    grid-template-columns: 1fr;
  }

  .hero {
    padding-top: 4rem;
  }

  .hero-copy h1 {
    font-size: 2.5rem;
  }

  .hero-actions {
    flex-direction: column;
    align-items: stretch;
  }

  .section {
    padding: 4rem 0;
  }

  .footer-inner {
    flex-direction: column;
    text-align: center;
  }
}
